name: Build AL-SAKOTI ICU APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Download the latest web version
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          curl -fL \
            https://effervescent-alpaca-702c1b.netlify.app/ \
            -o www/index.html

          test -s www/index.html

          grep -q "A. PATIENT DATA" www/index.html || {
            echo "ERROR: Wrong or old Netlify version."
            exit 1
          }

          echo "Web app downloaded successfully."

      # Create Capacitor configuration
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.alsakoti.micu",
            "appName": "AL-SAKOTI ICU",
            "webDir": "www"
          }
          EOF

          cat capacitor.config.json

      # Install Capacitor
      - name: Install dependencies
        run: |
          npm install

      # Create Android project
      - name: Add Android
        run: |
          npx cap add android

      # Keep YOUR ORIGINAL ICON
      - name: Set original AL-SAKOTI icon
        run: |
          test -f icon-192.png || {
            echo "ERROR: icon-192.png not found."
            exit 1
          }

          echo "Using the original uploaded icon: icon-192.png"

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d

            cp icon-192.png \
              android/app/src/main/res/mipmap-$d/ic_launcher.png

            cp icon-192.png \
              android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

      # Make sure Android uses the correct package
      - name: Fix Android Application ID
        run: |
          python3 - <<'PY'
          import re

          p = "android/app/build.gradle"

          with open(p, "r") as f:
              s = f.read()

          s = re.sub(
              r'applicationId\s+"[^"]+"',
              'applicationId "com.alsakoti.micu"',
              s,
              count=1
          )

          with open(p, "w") as f:
              f.write(s)

          print("Application ID = com.alsakoti.micu")
          PY

      # Sync Capacitor
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # Verify launcher before building
      - name: Verify Android launcher
        run: |
          echo "=============================="
          echo "APPLICATION ID"
          echo "=============================="
          grep -n "applicationId" android/app/build.gradle || true

          echo ""
          echo "=============================="
          echo "MAIN ACTIVITY"
          echo "=============================="
          find android/app/src/main \
            -type f \
            \( -name "MainActivity.java" -o -name "MainActivity.kt" \) \
            -print

          echo ""
          echo "=============================="
          echo "LAUNCHER"
          echo "=============================="
          grep -R -n \
            -E "android.intent.action.MAIN|android.intent.category.LAUNCHER" \
            android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "=============================="
          echo "MANIFEST"
          echo "=============================="
          cat android/app/src/main/AndroidManifest.xml

      # Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      # Verify APK
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            find android/app/build/outputs -type f || true
            exit 1
          fi

          echo "=============================="
          echo "APK CREATED SUCCESSFULLY"
          echo "=============================="

          ls -lh "$APK"

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-SAKOTI-ICU-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
