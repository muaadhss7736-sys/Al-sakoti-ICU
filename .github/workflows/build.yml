name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          curl -fL https://effervescent-alpaca-702c1b.netlify.app/ -o www/index.html
          grep -q "A. PATIENT DATA" www/index.html || (echo "Netlify site is not the latest version" && exit 1)
      - run: npm install
      - run: npx cap add android
      - name: Set custom icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp icon-192.png android/app/src/main/res/mipmap-$d/$n.png
            done
          done
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: M-ICU-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
