name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          curl -fL https://effervescent-alpaca-702c1b.netlify.app/ -o www/index.html
          grep -q "function focEnd" www/index.html || (echo "Netlify site is not the latest version" && exit 1)
      - name: Prepare signing key
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "Add the KEYSTORE_PASSWORD secret first"; exit 1; fi
          mkdir -p signing
          if [ ! -f signing/release.keystore ]; then
            keytool -genkeypair -keystore signing/release.keystore -storetype PKCS12 -alias micu -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Al-sakoti ICU, O=Al-sakoti, C=YE"
            echo "NEWKEY=true" >> "$GITHUB_ENV"
          fi
      - name: Save signing key (first run only)
        if: env.NEWKEY == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add signing/release.keystore
          git commit -m "Add signing key"
          git push
      - run: npm install
      - run: npx cap add android
      - name: Set custom icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp icon-192.png android/app/src/main/res/mipmap-$d/$n.png
            done
          done
      - name: Apply fixed signing and version
        env:
          RUN_NO: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os,re
          p="android/app/build.gradle"
          s=open(p).read()
          cfg='android {\n    signingConfigs {\n        debug {\n            storeFile file(System.getenv("KS_FILE"))\n            storePassword System.getenv("KS_PASS")\n            keyAlias "micu"\n            keyPassword System.getenv("KS_PASS")\n        }\n    }'
          assert "android {" in s
          s=s.replace("android {",cfg,1)
          s=re.sub(r"versionCode\s+\d+","versionCode "+os.environ["RUN_NO"],s,count=1)
          open(p,"w").write(s)
          print("build.gradle patched")
          PY
      - run: npx cap sync android
      - name: Build debug APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_FILE: ${{ github.workspace }}/signing/release.keystore
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Show signing certificate
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | head -4 || true
      - uses: actions/upload-artifact@v4
        with:
          name: M-ICU-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
