name: Build AL-SAKOTI ICU APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # =========================
      # 1. Download latest app
      # =========================
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          curl -fL \
            https://effervescent-alpaca-702c1b.netlify.app/ \
            -o www/index.html

          test -s www/index.html

          grep -q "A. PATIENT DATA" www/index.html || {
            echo "ERROR: Wrong or old Netlify version."
            exit 1
          }

          echo "Web app downloaded successfully."

      # =========================
      # 2. Fixed Capacitor identity
      # =========================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.alsakoti.micu",
            "appName": "AL-SAKOTI ICU",
            "webDir": "www"
          }
          EOF

          cat capacitor.config.json

      # =========================
      # 3. Install
      # =========================
      - name: Install dependencies
        run: npm install

      # =========================
      # 4. Create Android project
      # =========================
      - name: Add Android
        run: npx cap add android

      # =========================
      # 5. Verify MainActivity
      # =========================
      - name: Verify MainActivity
        run: |
          echo "MainActivity files:"
          find android/app/src/main \
            -type f \
            \( -name "MainActivity.java" -o -name "MainActivity.kt" \) \
            -print

          echo ""
          echo "Android Manifest:"
          cat android/app/src/main/AndroidManifest.xml

      # =========================
      # 6. Force correct Application ID
      # =========================
      - name: Fix Android Application ID
        run: |
          python3 - <<'PY'
          import re

          p = "android/app/build.gradle"

          with open(p, "r") as f:
              s = f.read()

          s = re.sub(
              r'applicationId\s+"[^"]+"',
              'applicationId "com.alsakoti.micu"',
              s,
              count=1
          )

          with open(p, "w") as f:
              f.write(s)

          print("Application ID fixed:")
          print("com.alsakoti.micu")
          PY

      # =========================
      # 7. Set icon
      # =========================
      - name: Set application icon
        run: |
          test -f icon-192.png || {
            echo "ERROR: icon-192.png not found."
            exit 1
          }

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d

            cp icon-192.png \
              android/app/src/main/res/mipmap-$d/ic_launcher.png

            cp icon-192.png \
              android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

      # =========================
      # 8. Sync Capacitor
      # =========================
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # =========================
      # 9. Verify launcher
      # =========================
      - name: Verify launcher configuration
        run: |
          echo "Application ID:"
          grep -n "applicationId" android/app/build.gradle

          echo ""
          echo "MainActivity:"
          find android/app/src/main \
            -type f \
            \( -name "MainActivity.java" -o -name "MainActivity.kt" \) \
            -print

          echo ""
          echo "Launcher entries:"
          grep -R -n \
            -E "android.intent.action.MAIN|android.intent.category.LAUNCHER" \
            android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "Manifest:"
          cat android/app/src/main/AndroidManifest.xml

      # =========================
      # 10. Build APK
      # =========================
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      # =========================
      # 11. Verify APK exists
      # =========================
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            find android/app/build/outputs -type f || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # =========================
      # 12. Upload
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-SAKOTI-ICU-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
